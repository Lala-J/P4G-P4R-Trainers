<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="P4G Trainer: an in-game trainer for Persona 4 Golden">
  <title>P4G Trainer</title>
  <defs>
    <filter id="static" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.55"/></feComponentTransfer>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#fff" opacity="0.05"/>
    </pattern>
    <pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="6" height="14" fill="#0b0b0b" opacity="0.10"/>
    </pattern>
    <clipPath id="screen"><rect x="866" y="64" width="330" height="236" rx="26"/></clipPath>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a26"/>
      <stop offset="1" stop-color="#0f0f0e"/>
    </linearGradient>
    <style>
      .t { font-family: 'Arial Black', 'Segoe UI Black', 'Helvetica Neue', Arial, sans-serif; font-weight: 900; }
      .s { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; }
      .m { font-family: Consolas, 'SFMono-Regular', Menlo, monospace; font-weight: 700; }
      .a { animation: pulse 1.2s ease-in-out infinite; }
      .a2 { animation-delay: .4s; } .a3 { animation-delay: .8s; }
      @keyframes pulse { 0%, 100% { opacity: .2 } 35% { opacity: 1 } }
      .rain { animation: fall .9s linear infinite; }
      @keyframes fall { from { transform: translate(0, -60px) } to { transform: translate(-22px, 60px) } }
      .flicker { animation: flick 2.4s steps(1) infinite; }
      @keyframes flick { 0%, 100% { opacity: .9 } 47% { opacity: .55 } 50% { opacity: 1 } 53% { opacity: .7 } }
      .blink { animation: blink 1.6s steps(1) infinite; }
      @keyframes blink { 0%, 60% { opacity: 1 } 61%, 100% { opacity: 0 } }
    </style>
  </defs>

  <!-- a rainy night, through a dodgy signal -->
  <rect width="1280" height="400" fill="#0b0b0b"/>
  <rect width="1280" height="400" filter="url(#static)" opacity="0.35"/>

  <!-- stripes along the bottom -->
  <polygon points="0,318 1280,268 1280,280 0,330" fill="#F7941D"/>
  <polygon points="0,338 1280,288 1280,350 0,400" fill="#FFE100"/>
  <polygon points="0,338 1280,288 1280,350 0,400" fill="url(#hatch)"/>

  <!-- the TV, sitting on the stripe -->
  <rect x="846" y="44" width="370" height="276" rx="38" fill="#141413" stroke="#FFE100" stroke-width="6"/>
  <rect x="866" y="64" width="330" height="236" rx="26" fill="url(#glow)"/>
  <g clip-path="url(#screen)">
    <rect class="flicker" x="866" y="64" width="330" height="236" filter="url(#static)"/>
    <g class="rain" stroke="#cfd6e6" stroke-width="2" opacity="0.35" stroke-linecap="round">
      <path d="M900 34 l-10 26 M960 64 l-10 26 M1010 24 l-10 26 M1070 84 l-10 26 M1130 44 l-10 26 M1180 94 l-10 26
               M930 144 l-10 26 M990 194 l-10 26 M1050 154 l-10 26 M1110 214 l-10 26 M1170 164 l-10 26
               M915 254 l-10 26 M985 294 l-10 26 M1045 264 l-10 26 M1120 314 l-10 26 M1190 274 l-10 26"/>
    </g>
    <g transform="translate(1031 0) skewX(-10)">
      <text class="t" x="34" y="222" font-size="118" fill="#FFE100" text-anchor="middle">???</text>
    </g>
    <text class="m" x="888" y="98" font-size="20" fill="#fff">CH 4</text>
    <circle class="blink" cx="1172" cy="91" r="7" fill="#e63c32"/>
  </g>
  <rect x="866" y="64" width="330" height="236" rx="26" fill="url(#scan)"/>
  <rect x="990" y="320" width="82" height="10" fill="#141413"/>

  <!-- title -->
  <g transform="skewX(-12)">
    <text class="t" x="118" y="196" font-size="176" fill="#FFE100" letter-spacing="-4">P4G</text>
    <text class="t" x="96" y="282" font-size="84" fill="#f5f5f0" letter-spacing="5">TRAINER</text>
  </g>

  <!-- a menu, P4 style: slanted tags stepping down -->
  <g class="s" font-size="19" letter-spacing="2" fill="#f5f5f0">
    <g transform="translate(560 84) skewX(-14)">
      <rect width="132" height="34" fill="#141413"/><rect width="6" height="34" fill="#FFE100"/>
      <text x="20" y="24">BATTLE</text>
    </g>
    <g transform="translate(588 130) skewX(-14)">
      <rect width="158" height="34" fill="#141413"/><rect width="6" height="34" fill="#FFE100"/>
      <text x="20" y="24">PERSONAS</text>
    </g>
    <g transform="translate(616 176) skewX(-14)">
      <rect width="196" height="34" fill="#141413"/><rect width="6" height="34" fill="#FFE100"/>
      <text x="20" y="24">SOCIAL LINKS</text>
    </g>
    <g transform="translate(644 222) skewX(-14)">
      <rect width="168" height="34" fill="#FFE100"/>
      <text x="20" y="24" fill="#0b0b0b">AUTOPLAY</text>
    </g>
  </g>

  <!-- tag line along the yellow stripe, led by the autoplay arrows -->
  <g transform="rotate(-2.237 640 344)">
    <g fill="#0b0b0b">
      <polygon class="a" points="60,334 76,344 60,354"/>
      <polygon class="a a2" points="82,334 98,344 82,354"/>
      <polygon class="a a3" points="104,334 120,344 104,354"/>
    </g>
    <text class="s" x="136" y="352" font-size="22" fill="#0b0b0b" letter-spacing="2">IN-GAME TRAINER  ·  PERSONA 4 GOLDEN  ·  STEAM PC</text>
  </g>

  <rect width="1280" height="400" fill="url(#scan)"/>
</svg>
